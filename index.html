
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="css.css">
</head>
<body>
    <contener>
        <headbox>
            <input
                type="text"
                id="name"
                placeholder="NAME"
                required
            >

            <input
                type="text"
                id="SurName"
                placeholder="SURNAME"
                required
            >

            <input
                type="tel"
                id="PhoneNumber"
                placeholder="PHONE NUMBER"
                required
            >

            <button id="register" type="button">
                Register
            </button>
        </headbox>
    </contener>

    <script src="funktions.js"></script>
</body>
</html>
